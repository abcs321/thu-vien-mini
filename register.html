    <!-- =========================
         TRANG ĐĂNG KÝ
         ========================= -->

    <main class="register-page">

        <div class="register-box">

            <!-- TIÊU ĐỀ -->

            <h1>
                ĐĂNG KÝ
            </h1>

            <p class="register-subtitle">
                Tạo tài khoản mới để sử dụng thư viện
            </p>


            <!-- FORM -->

            <form
                action="#"
                method="post"
            >


                <!-- TÊN ĐĂNG NHẬP -->

                <div class="form-group">

                    <label for="username">
                        Tên đăng nhập
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập tên đăng nhập"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Nhập email"
                        required
                    >

                </div>


                <!-- MẬT KHẨU -->

                <div class="form-group">

                    <label for="password">
                        Mật khẩu
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập mật khẩu"
                        required
                    >

                </div>


                <!-- NHẬP LẠI MẬT KHẨU -->

                <div class="form-group">

                    <label for="confirm-password">
                        Nhập lại mật khẩu
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Nhập lại mật khẩu"
                        required
                    >

                </div>


                <!-- ĐIỀU KHOẢN -->

                <div class="register-options">

                    <label>

                        <input
                            type="checkbox"
                            name="terms"
                            required
                        >

                        Tôi đồng ý với điều khoản sử dụng

                    </label>

                </div>


                <!-- NÚT ĐĂNG KÝ -->

                <button
                    type="submit"
                    class="form-btn"
                >
                    ĐĂNG KÝ
                </button>

            </form>


            <!-- LINK ĐĂNG NHẬP -->

            <p class="login-link">

                Đã có tài khoản?

                <a href="login.html">
                    Đăng nhập
                </a>

            </p>

        </div>

    </main>
